server {
    bind_address = "127.0.0.1"
    bind_port = "18081"
    socket_path = "/tmp/spire-react-server/private/api.sock"
    trust_domain = "example.org"
    data_dir = "/tmp/spire-react-data/server"
    log_level = "DEBUG"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/tmp/spire-react-data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data = {}
    }

    KeyManager "memory" {
        plugin_data = {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path = "/home/dev1/react-agent/spire/conf/server/dummy_upstream_ca.key"
            cert_file_path = "/home/dev1/react-agent/spire/conf/server/dummy_upstream_ca.crt"
        }
    }
}
