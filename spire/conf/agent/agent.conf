agent {
    data_dir = "/tmp/spire-react-data/agent"
    log_level = "DEBUG"
    server_address = "127.0.0.1"
    server_port = "18081"
    socket_path = "/tmp/spire-react-agent/public/api.sock"
    trust_bundle_path = "/home/dev1/react-agent/spire/conf/agent/dummy_root_ca.crt"
    trust_domain = "example.org"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data = {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/tmp/spire-react-data/agent"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data = {}
    }
}
